<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다례(茶禮) — 차, 이제 검색하지 말고 물어보세요</title>
<meta name="description" content="흩어진 차 효능·정보와 구매처를 한 곳에서. 취향을 알려주면 다례가 맞는 차를 먼저 골라드립니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="top">
  <div class="row wrap">
    <a class="brand" href="#top" aria-label="다례 홈으로">
      <span class="mark">다례</span>
      <span class="hanja">茶禮</span>
    </a>
    <nav class="main-nav" aria-label="주요 메뉴">
      <a href="#feed">커뮤니티</a>
      <a href="#curator">취향 큐레이터</a>
      <a href="#shop">샵</a>
    </nav>
  </div>
</header>

<main id="top">

  <section class="hero wrap">
    <p class="eyebrow">Tea Information &amp; Curation</p>
    <h1>차, 이제 검색하지 말고<br>물어보세요.</h1>
    <p class="hero-desc">흩어진 효능 정보와 구매처를 다례가 대신 정리합니다. 전통차부터 해외차까지, 취향에 맞는 한 잔을 먼저 골라드릴게요.</p>
  </section>

  <!-- 1. 커뮤니티 콘텐츠 피드 -->
  <section id="feed" class="wrap section">
    <div class="section-head">
      <div>
        <h2>다례가 전하는 차 이야기</h2>
        <p class="section-sub">다례 팀이 직접 쓰는 효능·정보 콘텐츠</p>
      </div>
      <button type="button" class="link-btn" id="btn-feed-more">더보기</button>
    </div>
    <div class="feed-list" id="feed-list"></div>
  </section>

  <!-- 2. 취향 큐레이터 CTA -->
  <section id="curator" class="wrap section">
    <div class="curator-card" id="curator-card"></div>
  </section>

  <!-- 3. 샵 (상품 그리드) -->
  <section id="shop" class="wrap section">
    <div class="section-head">
      <div>
        <h2>차 둘러보기</h2>
        <p class="section-sub" id="shop-count"></p>
      </div>
    </div>
    <div class="filter-row" id="filter-row"></div>
    <div class="shop-grid" id="shop-grid"></div>
  </section>

</main>

<footer class="foot">
  <div class="wrap foot-row">
    <span>다례(茶禮) · MVP 테스트 버전</span>
    <span>실제 결제·배송은 연결되어 있지 않습니다</span>
  </div>
</footer>

<!-- 취향 온보딩 오버레이 -->
<div class="overlay" id="overlay-onboarding" hidden>
  <div class="sheet onb-sheet" role="dialog" aria-modal="true" aria-labelledby="onb-title">
    <div class="close-row"><button class="close-btn" data-close="overlay-onboarding" aria-label="닫기">✕</button></div>
    <div class="step-label">약 30초 · 3가지만 알려주세요</div>
    <h2 id="onb-title">당신의 차 취향은?</h2>

    <div class="onb-step">
      <div class="step-label">1. 끌리는 맛 (최대 2개)</div>
      <div class="chip-grid" id="taste-chips" role="group" aria-label="선호하는 맛"></div>
    </div>
    <div class="onb-step">
      <div class="step-label">2. 카페인</div>
      <div class="chip-grid" id="caffeine-chips" role="group" aria-label="카페인 선호"></div>
    </div>
    <div class="onb-step">
      <div class="step-label">3. 지금 마시고 싶은 이유</div>
      <div class="chip-grid" id="purpose-chips" role="group" aria-label="목적"></div>
    </div>

    <div class="onb-foot">
      <button class="btn ghost" id="btn-skip">건너뛰고 전체 둘러보기</button>
      <button class="btn primary" id="btn-submit-onb" disabled>내 큐레이션 보기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/shop.js"></script>
<script src="js/app.js"></script>
</body>
</html>
