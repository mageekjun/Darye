<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>취향 큐레이터 — 다례(茶禮)</title>
<meta name="description" content="맛·바디감·향·카페인·시간대까지 8가지 기준으로 취향에 맞는 차를 골라드립니다.">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="curator">

<main>
  <div class="page">

    <!-- 진단 -->
    <section id="screen-quiz" hidden>
      <div class="quiz-head">
        <p class="eyebrow">Tea Curator</p>
        <div class="quiz-progress" role="progressbar" aria-label="진단 진행률" aria-valuemin="0" aria-valuemax="100">
          <div class="quiz-bar" id="quiz-bar"></div>
        </div>
        <p class="quiz-count" id="quiz-count"></p>
      </div>

      <div class="quiz-card">
        <h1 class="quiz-q" id="quiz-q"></h1>
        <p class="quiz-help" id="quiz-help"></p>
        <div class="chip-grid" id="quiz-options" role="group"></div>
        <div class="quiz-nav">
          <button type="button" class="btn ghost" id="btn-prev">이전</button>
          <button type="button" class="btn primary" id="btn-next">다음</button>
        </div>
      </div>
    </section>

    <!-- 결과 -->
    <section id="screen-result" hidden>
      <div class="result-head">
        <div>
          <h2>당신을 위한 큐레이션</h2>
          <div class="rh-sub" id="result-summary"></div>
        </div>
        <button type="button" class="retake" id="btn-retake">취향 다시 설정</button>
      </div>

      <div class="section">
        <div class="section-head">
          <div>
            <h2>가장 잘 맞는 차 3종</h2>
            <p class="section-sub">8가지 기준을 항목별로 채점해 정렬했습니다</p>
          </div>
        </div>
        <div class="top-pick-row" id="top-picks"></div>
      </div>

      <div class="section">
        <div class="section-head">
          <div>
            <h2>나머지 추천 순위</h2>
            <p class="section-sub">일치율 순</p>
          </div>
          <a class="more-link" href="shop.html">샵에서 전체 보기 →</a>
        </div>
        <div class="shop-grid" id="rest-grid"></div>
      </div>
    </section>

  </div>
</main>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/layout.js"></script>
<script src="js/curator.js"></script>
</body>
</html>
